[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baseline-shopping-agent"
version = "0.1.0"
description = "Bounded conversational shopping with optional user and procedural memory"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
shopping-agent = "shopping_agent.cli:main"

[project.optional-dependencies]
dev = ["ruff>=0.14,<1"]
ui = ["streamlit>=1.66,<2"]
experiment = ["tokenizers==0.23.3"]
langchain = [
    "langchain==1.4.7",
    "langgraph==1.2.19",
    "langchain-deepseek==1.1.1",
    "langgraph-checkpoint-sqlite==3.1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
